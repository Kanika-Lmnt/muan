<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var KEY = 'muan-theme';
        var saved = localStorage.getItem(KEY);
        // cream (light) is the default look; dark only for someone who
        // picked it, and 'auto' (the toggle's third state) follows the
        // clock the same way resolvedTheme() in js/app.js does
        var h = new Date().getHours();
        var theme = (saved === 'light' || saved === 'dark') ? saved
          : saved === 'auto' ? ((h >= 17 || h < 6) ? 'dark' : 'light')
          : 'light';
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
      window.__bootStart = performance.now();

      // First-paint data, requested here rather than from boot() at the
      // bottom of the body. js/app.js cannot run until it has downloaded,
      // so a fetch started inside boot() only begins hundreds of ms into
      // the load on a phone; started here it is in flight before the
      // stylesheets below have even been requested.
      //
      // data/venues.json is the mirror of D1 that already ships in every
      // deploy as /api/venues' outage fallback (see functions/api/venues.js
      // and scripts/export-venues.js). It is a static file served straight
      // off the Pages edge — no Function invocation, no D1 round trip — so
      // the map and the list can be drawn from it in full while the live
      // /api/venues response is still on the wire. boot() reads these
      // promises off window.__boot and reconciles the live list against the
      // bundle when it lands; it falls back to fetching for itself if this
      // block ever fails to run.
      window.__boot = {
        venues: fetch('data/venues.json').then(function (r) { return r.json(); }),
        events: fetch('data/events.json').then(function (r) { return r.json(); }),
        picks: fetch('data/picks.json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; }),
        live: fetch((window.PSD_SERVER || '') + '/api/venues')
          .then(function (r) { return r.json(); })
          .catch(function () { return null; }),
      };
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- "Paisaidee (ມ່ວນ)" used to be here. ມ່ວນ is the old internal project
       name, and CLAUDE.md is explicit that it stays internal (muan-db, the
       repo, muan.pages.dev) while the display name is Paisaidee — so the one
       place it was shown to a human, and to every search result and link
       preview, was the one place it did not belong. The Lao that belongs
       next to the brand is ໄປໃສດີ, which the brand lockup already carries. -->
  <meta name="description" content="Paisaidee — a live map of bars, cafes and events in Vientiane. ຄືນນີ້ໄປໃສດີ?">
  <meta name="theme-color" content="#FFFCF5">

  <!-- Link previews. The block between these two markers is what
       functions/index.js rewrites for a /?v=<venue-id> share link — it does a
       single replace on the whole block, so the exact comment text is load-
       bearing; if either marker goes missing the Function leaves the page
       completely alone and these site-wide defaults are what gets shared.
       Keep the markers, keep the tags inside them.

       og:image / og:url are absolute because scrapers are inconsistent about
       resolving relative ones, which means the production host is hardcoded.
       muan.pages.dev is still it (README: a custom domain is pending, same
       purchase trip as LaoWander) — when paisaidee.app lands, these two
       lines change and nothing else does. Function-rewritten previews build
       their URLs from the incoming request instead, so they follow whatever
       host the link was actually shared on, including preview deploys. -->

    #splash {
      position: fixed; inset: 0; z-index: 999;
      display: flex; align-items: center; justify-content: center;
      background: #141215;
      transition: opacity .45s ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    .splash-inner { display: flex; flex-direction: column; align-items: center; color: #F5F1E8; }
    .splash-lao {
      font-family: 'PSD Lao', 'Noto Sans Lao', sans-serif; font-size: 15px; line-height: 1.6;
      opacity: .55; animation: splash-fade .6s ease backwards;
    }
    .splash-word {
      display: flex; margin-top: 6px; padding-left: .46em; /* tracking adds space after the last letter; this re-centres it */
      font-family: 'PSD Word', system-ui, sans-serif; font-weight: 400;
      font-size: 26px; letter-spacing: .46em; line-height: 1;
    }
    .splash-word span { animation: splash-letter .55s cubic-bezier(.2,.7,.2,1) backwards;
      animation-delay: calc(var(--i) * 45ms + 80ms); }
    .splash-line {
      position: relative; overflow: hidden; width: 72px; height: 1px; margin-top: 22px;
      background: rgba(245,241,232,.14); animation: splash-fade .6s ease .45s backwards;
    }
    .splash-line::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 40%;
      background: linear-gradient(90deg, transparent, #FF5A3C, transparent);
      animation: splash-run 1.4s ease-in-out .6s infinite; transform: translateX(-100%);
    }
    @keyframes splash-fade { from { opacity: 0; } }
    @keyframes splash-letter { from { opacity: 0; transform: translateY(6px); filter: blur(3px); } }
    @keyframes splash-run { to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      .splash-lao, .splash-word span, .splash-line { animation: none; }
      .splash-line::after { animation: none; transform: none; left: 30%; }
    }

    [data-theme="light"] #splash { background: #FFFCF5; }
    [data-theme="light"] .splash-inner { color: #2A2419; }
    [data-theme="light"] .splash-line { background: rgba(42,36,25,.14); }
    [data-theme="light"] .splash-line::after { background: linear-gradient(90deg, transparent, #E8462A, transparent); }

  <!-- Both of these were plain render-blocking stylesheets on third-party
       origins, which means nothing on the page could paint — not even the
       splash below, which is otherwise entirely self-contained inline CSS —
       until fonts.googleapis.com and unpkg.com had each been resolved,
       connected to and read. That is two round trips to somebody else's
       server in front of the first pixel, on the connection a phone in
       Vientiane actually has.
       Loaded as a preload that promotes itself to a stylesheet on arrival
       instead, so neither is on the critical path. The <noscript> copies
       keep them working with scripting off.

       The font swap this can cause is not a new behaviour: the Google Fonts
       URL already carries display=swap, so a first frame in the fallback
       stack (system-ui / sans-serif — see --font in style.css) followed by
       a swap to Space Grotesk + Noto Sans Lao was already the designed
       behaviour on any slow connection. This only makes the frame before
       the swap paint sooner. If it reads badly on a real device, reverting
       is exactly these two lines back to rel="stylesheet".
       maplibre-gl.css styles the map's own controls (attribution, zoom) and
       nothing else; maplibre-gl.js is already async, so those controls do
       not exist until well after this has landed either way. -->
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Lao:wght@400;700&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" as="style"
        href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  </noscript>

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <!-- add-to-home-screen (README's "Before public launch" list). No service
       worker is registered and none is planned yet, so this is an installable
       shortcut, not an offline app: launched from the home screen it still
       needs the network for everything, exactly as the browser tab does.
       apple-touch-icon is listed separately because iOS ignores the
       manifest's icons array when picking the home-screen glyph. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <div class="splash-lao" lang="lo">ໄປໃສດີ</div>
    <div class="splash-word" role="img" aria-label="Paisaidee"><span style="--i:0">P</span><span style="--i:1">A</span><span style="--i:2">I</span><span style="--i:3">S</span><span style="--i:4">A</span><span style="--i:5">I</span><span style="--i:6">D</span><span style="--i:7">E</span><span style="--i:8">E</span></div>
    <div class="splash-line" aria-hidden="true"></div>
  </div>
</div>
<div id="app">

  <div id="map"></div>

  <header id="topbar">
    <div class="row">
      <div class="pill brand-pill">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-words">
            <span class="brand-lo lao">ໄປໃສດີ</span>
            <span class="brand-en">PAISAIDEE</span>
          </span>
        </div>
      </div>
      <button class="pill" id="locateBtn" aria-label="Show my location">
        <span id="locateIcon"></span><span id="locateLabel">near me</span>
      </button>
      <button class="pill" id="themeBtn" aria-label="Switch theme">
        <span id="themeIcon"></span><span id="themeLabel" class="pill-label">auto</span>
      </button>
      <button class="pill" id="avatarBtn" aria-label="Choose your avatar"><span id="avatarSlot">😊</span></button>
    </div>
    <!-- Bars/Cafes/Events each carried a <span class="chip-dot"> painted in
         that filter's own map-pin colour. Removed — see the note where the
         .chip-dot rules used to be in style.css. The spans go with the CSS
         rather than being left in place empty: .chip is a flex row with a
         gap, so a 0-width child with no fill would still open a gap before
         the label. -->
    <div class="chip-bar" id="chipBar">
      <button class="chip on" data-filter="all"><span class="lao">ທັງໝົດ</span> · All</button>
      <button class="chip" data-filter="bar"><span class="lao">ບາຣ໌</span> · Bars</button>
      <button class="chip" data-filter="cafe"><span class="lao">ຄາເຟ</span> · Cafes</button>
      <!-- hidden until at least one restaurant exists — see syncTypeChips()
           in js/app.js. Order here must match FILTER_ORDER (swipe order). -->
      <button class="chip" data-filter="restaurant" hidden><span class="lao">ຮ້ານອາຫານ</span> · Restaurants</button>
      <button class="chip" data-filter="event"><span class="lao">ອີເວັນ</span> · Events</button>
    </div>
  </header>

  <div id="routeBar" hidden role="button" tabindex="0" aria-label="Route showing — tap to re-frame the map">
    <span id="routeBarLabel"></span>
    <button id="routeBarClose" aria-label="Hide route">✕</button>
  </div>
  <button id="sheetToggle" aria-label="Show or hide the list">‹</button>
  <section id="sheet" aria-live="polite">
    <div id="sheetTopCover" aria-hidden="true"></div>
    <div id="sheetHandle" aria-hidden="true"></div>
    <div id="mapWarning" class="map-warning" hidden>
      <span>Map tiles didn't load — check your connection. The list still works.</span>
      <button id="mapWarningClose" aria-label="Dismiss">✕</button>
    </div>
    <div id="staleWarning" class="map-warning" hidden>
      <span>Showing saved venue data — some details may be out of date.</span>
      <button id="staleWarningClose" aria-label="Dismiss">✕</button>
    </div>
    <div id="sheetInner"></div>
  </section>

  <nav id="bottomNav" aria-label="Screens">
    <button class="nav-item" data-nav="home" aria-label="Home">
      <span class="nav-ico" id="navHomeIcon" aria-hidden="true"></span><span class="nav-lb"><span class="lao">ໜ້າຫຼັກ</span> · Home</span>
    </button>
    <button class="nav-item" data-nav="map" aria-label="Map">
      <span class="nav-ico" id="navMapIcon" aria-hidden="true"></span><span class="nav-lb"><span class="lao">ແຜນທີ່</span> · Map</span>
    </button>
    <button class="nav-item" data-nav="you" aria-label="You">
      <span class="nav-ico" id="navYouIcon" aria-hidden="true"></span><span class="nav-lb"><span class="lao">ຂ້ອຍ</span> · You</span>
    </button>
  </nav>

</div>

<script id="maplibre-js" async src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/app.js"></script>
</body>
